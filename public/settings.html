<!DOCTYPE html>
<html lang="en" class="public-site">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — AgriPricePH</title>
  <script src="js/public-settings.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="css/landpage.css" />
  <link rel="stylesheet" href="css/public.css" />
  <link rel="stylesheet" href="css/landpage-nav.css" />
  <link rel="stylesheet" href="css/public-alert.css" />
</head>
<body data-page="settings" data-title="Settings" data-subtitle="Guest & account preferences">

<main class="page-content" id="public-page-content">

  <div id="settings-toast" class="settings-toast" role="status" aria-live="polite"></div>

  <p class="public-page-lead">
    Your account and appearance preferences. Changes are saved in your browser on this device.
  </p>

  <section class="public-card settings-section">
    <h3>Account</h3>
    <div id="settings-account-card"></div>
  </section>

  <section class="public-card settings-section">
    <h3>Appearance</h3>
    <div class="settings-row">
      <div class="settings-row-label">
        <strong>Theme</strong>
        <span>Light, dark, or match your system</span>
      </div>
      <select class="form-input settings-select" id="set-theme" aria-label="Theme">
        <option value="system">System default</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div class="settings-row settings-row-toggle">
      <div class="settings-row-label">
        <strong>Compact layout</strong>
        <span>Tighter spacing on cards and grids</span>
      </div>
      <label class="settings-switch">
        <input type="checkbox" id="set-compact" />
        <span class="settings-switch-ui"></span>
      </label>
    </div>
    <div class="settings-row settings-row-toggle">
      <div class="settings-row-label">
        <strong>Reduce motion</strong>
        <span>Minimize animations and transitions</span>
      </div>
      <label class="settings-switch">
        <input type="checkbox" id="set-reduce-motion" />
        <span class="settings-switch-ui"></span>
      </label>
    </div>
  </section>

</main>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="js/public-alert.js"></script>
<script src="js/public-auth.js"></script>
<script src="js/public-auth-modal.js"></script>
<script src="js/public-shell.js"></script>
<script src="js/public-pages.js"></script>
</body>
</html>
